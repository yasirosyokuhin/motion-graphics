<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky filter bar over a dense, auto-filling grid of live screens; one modal stage. */
:root {
  color-scheme: dark;
  --bg: #08080c;
  --panel: #101017;
  --line: #24242e;
  --fg: #ececf2;
  --dim: #8a8a9c;
  --acc: #00f0ff;
  --acc2: #ff2bd6;
  --display: "Dela Gothic One", "Noto Sans JP", sans-serif;
  --body: "Noto Sans JP", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 28px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font: 400 clamp(28px, 5vw, 48px)/1.05 var(--display); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--acc); }
.sub { color: var(--dim); font: 400 12px/1.6 var(--mono); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input, select { font: 400 13px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
#q { flex: 1 1 220px; }
.check { display: flex; align-items: center; gap: 6px; font: 400 12px var(--mono); color: var(--dim); }
#count { font: 700 12px var(--mono); color: var(--acc); margin-left: auto; font-variant-numeric: tabular-nums; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; font: 400 12px var(--body); color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip span { font: 400 10px var(--mono); margin-left: 6px; opacity: 0.7; }
.chip:hover { color: var(--fg); border-color: var(--dim); }
.chip.on { color: #000; background: var(--fg); border-color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding-block: 16px 48px; }
.card { display: grid; gap: 6px; padding: 0; background: none; border: 0; color: inherit; text-align: left; cursor: pointer; min-width: 0; }
.card canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #0b0b10; border: 1px solid var(--line); transition: border-color .15s; }
.card:hover canvas { border-color: var(--acc); }
.meta { display: grid; min-width: 0; }
.meta b { font: 700 13px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta span { font: 400 11px var(--mono); color: var(--dim); }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(4, 4, 8, 0.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.stage { width: min(1100px, 100%); display: grid; gap: 12px; }
#mCanvas { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; border: 1px solid var(--line); background: #0b0b10; }
.info { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
#mTitle { font: 400 22px var(--display); margin: 0; }
#mCat { font: 400 12px var(--mono); color: var(--acc); }
#mNote { color: var(--dim); margin: 0; max-width: 70ch; }
#mTags { display: flex; flex-wrap: wrap; gap: 6px; }
#mTags span { font: 400 11px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
#close { justify-self: end; font: 700 12px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
footer { color: var(--dim); font: 400 11px var(--mono); padding-block: 0 32px; }
footer a { color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .card canvas { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ASCII <em>CATALOG</em></h1>
    <div class="sub"><span id="total">632</span> pieces · ascii-magic-art · 画面に見えている作品だけ動きます</div>
  </header>
  <div class="bar">
    <div class="controls">
      <input id="q" type="search" placeholder="検索: moon, city, fire, torus, 宇宙…" aria-label="検索">
      <select id="look" aria-label="文字セット"></select>
      <label class="check"><input id="mv" type="checkbox"> MVに出るものだけ</label>
      <span id="count"></span>
    </div>
    <div class="cats" id="cats"></div>
  </div>
  <main class="grid" id="grid"></main>
  <footer>Pieces © ASCII Magic (ascii-magic.com), MIT License — <a href="https://github.com/kailashsr38/ascii-magic-art" target="_blank" rel="noopener">github.com/kailashsr38/ascii-magic-art</a></footer>
</div>
<div class="modal" id="modal" hidden>
  <div class="stage">
    <button id="close">閉じる ✕</button>
    <canvas id="mCanvas"></canvas>
    <div class="info"><h2 id="mTitle"></h2><span id="mCat"></span></div>
    <p id="mNote"></p>
    <div id="mTags"></div>
  </div>
</div>
<script type="module" src="src/catalog.js"></script>
</body>
</html>
