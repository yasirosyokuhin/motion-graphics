<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bungee&family=Cinzel:wght@900&family=Cormorant+Garamond:ital,wght@1,600&family=Dela+Gothic+One&family=DotGothic16&family=JetBrains+Mono:wght@500;700;800&family=Mochiy+Pop+One&family=Monoton&family=Noto+Sans+JP:wght@500;700;900&family=RocknRoll+One&family=Shippori+Mincho:wght@800&family=Space+Mono:wght@700&family=Syne:wght@800&family=Unbounded:wght@800&family=Yuji+Syuku&family=Zen+Antique&family=Zen+Maru+Gothic:wght@900&family=Zen+Old+Mincho:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="logo">MV<span>//</span>GEN</div>
  <div class="chips" id="chips"></div>
</header>
<main class="app">
  <aside class="panel">
    <section>
      <h2>01 / SONG</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="audio/*">
        <strong>音声ファイルをドロップ</strong>
        <small>mp3 / wav / m4a / ogg — またはクリック</small>
      </label>
      <button class="ghost" id="demo">▶ デモ曲で試す</button>
      <div class="row">
        <input id="title" placeholder="曲名 TITLE">
        <input id="artist" placeholder="アーティスト ARTIST">
      </div>
    </section>
    <section>
      <h2>02 / LYRICS</h2>
      <textarea id="lyrics" spellcheck="false" placeholder="歌詞を貼り付け（1行=1フレーズ、空行=間奏）&#10;LRC形式 [00:12.30]… ならそのタイミングで表示"></textarea>
      <div class="row">
        <button class="ghost" id="tap">⌨ タップで同期</button>
        <button class="ghost" id="copyLrc">LRCをコピー</button>
      </div>
      <p class="hint" id="lyricHint">タイミング無しの歌詞は曲の構造に合わせて自動配置。「タップで同期」→ 再生中に Space で各行の頭を叩くと正確な LRC になります。</p>
    </section>
    <section>
      <h2>03 / STYLE</h2>
      <div class="row">
        <select id="scene"></select>
      </div>
      <div class="row">
        <select id="preset"></select>
        <select id="aspect">
          <option value="16:9">16:9</option>
          <option value="9:16">9:16 縦</option>
          <option value="1:1">1:1</option>
        </select>
      </div>
      <div class="row">
        <select id="quality">
          <option value="720">720p</option>
          <option value="1080">1080p</option>
        </select>
        <label class="slider">FX <input type="range" id="intensity" min="0" max="2" step="0.05" value="1"></label>
      </div>
      <div class="row">
        <button class="primary" id="generate" disabled>GENERATE</button>
        <button class="ghost" id="reroll" disabled title="同じ設定で別カットを生成">↻ REROLL</button>
      </div>
    </section>
  </aside>
  <section class="stage">
    <div class="screen" id="screen">
      <canvas id="out"></canvas>
      <div class="overlay" id="overlay">
        <div class="big">DROP A SONG</div>
        <div class="small">音楽 × 歌詞 → ASCII / 絵画 / モーショングラフィックの MV を自動生成</div>
      </div>
      <div class="rec" id="rec" hidden>● REC</div>
      <div class="tapbox" id="tapbox" hidden></div>
    </div>
    <div class="transport">
      <button id="play" disabled>▶</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <canvas id="timeline"></canvas>
      <button id="fullscreen" title="Fullscreen">⛶</button>
      <button class="primary" id="export" disabled>● EXPORT</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
